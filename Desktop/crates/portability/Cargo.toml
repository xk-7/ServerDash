[package]
name = "serverdash-portability"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
csv = "1.3"
encoding_rs = "0.8"
futures-util = "0.3"
lzfse_rust = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-util = "0.7"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[dev-dependencies]
tempfile = "3"
