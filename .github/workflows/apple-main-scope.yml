name: Apple main scope

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Apple main scope / Validate Apple-only tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test and validate the Apple mainline boundary
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          bash Scripts/test-apple-main-scope.sh
          bash Scripts/check-apple-main-scope.sh --ref HEAD --source-branch "${SOURCE_BRANCH}"
