name: ServerDash

options:
  bundleIdPrefix: com.serverdash
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  xcodeVersion: "26.0"
  groupSortPosition: top

packages:
  SwiftTerm:
    path: Vendor/SwiftTerm
  Citadel:
    path: Vendor/Citadel
  NIOSSH:
    path: Vendor/swift-nio-ssh
  ZIPFoundation:
    path: Vendor/ZIPFoundation

targets:
  ServerDash:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Native
        excludes:
          - Tests
      - path: Vendor/RDP
        buildPhase: resources
        excludes:
          - dependencies.sha256
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: ZIPFoundation
      - framework: .build/rdp/ServerDashRDP.xcframework
        embed: false
      - sdk: MetalKit.framework
      - sdk: Carbon.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serverdash.app
        PRODUCT_NAME: ServerDash
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 5
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Native/SDRDPClient.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/.build/rdp/universal/Headers/freerdp3
          - $(SRCROOT)/.build/rdp/universal/Headers/winpr3
          - $(SRCROOT)/.build/rdp/universal/Headers
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ServerDash
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO

  ServerDashTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ServerDash
      - package: SwiftTerm
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serverdash.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

  ServerDashMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Mobile/Sources
      - path: Sources/Models.swift
      - path: Sources/RDPModels.swift
      - path: Sources/Persistence.swift
      - path: Sources/ProfessionalConnections.swift
      - path: Sources/Diagnostics.swift
      - path: Sources/ConnectionEngine.swift
      - path: Sources/TrustedHosts.swift
      - path: Sources/Services.swift
      - path: Sources/SFTPService.swift
      - path: Sources/DesignSystem.swift
      - path: Sources/DisplayFormat.swift
      - path: Sources/MonitoringHistory.swift
      - path: Sources/MonitorLayout.swift
      - path: Sources/RemoteConnection.swift
      - path: Sources/SessionTransfer.swift
      - path: Sources/SessionTransferAdapters.swift
      - path: Sources/SessionTransferViews.swift
      - path: Sources/TerminalWorkspace.swift
      - path: Sources/TerminalTools.swift
      - path: Sources/TerminalToolsViews.swift
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: NIOSSH
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serverdash.app.ios
        PRODUCT_NAME: ServerDashMobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 5
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ServerDash
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  ServerDashMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Mobile/Tests
      - path: Tests/SessionTransferTests.swift
      - path: Tests/TerminalWorkspaceTests.swift
    dependencies:
      - target: ServerDashMobile
      - package: SwiftTerm
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serverdash.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"

schemes:
  ServerDash:
    build:
      targets:
        ServerDash: all
        ServerDashTests: [test]
    test:
      targets:
        - ServerDashTests
  ServerDashMobile:
    build:
      targets:
        ServerDashMobile: all
        ServerDashMobileTests: [test]
    test:
      targets:
        - ServerDashMobileTests
